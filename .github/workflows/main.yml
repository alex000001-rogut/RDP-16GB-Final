name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Performance Cleanup and App Removal
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $ProgressPreference = "SilentlyContinue"

          Write-Host "=== PERFORMANCE CLEANUP + APP REMOVAL ==="
          $before = Get-PSDrive C
          Write-Host ("Free space before cleanup: {0:N2} GB" -f ($before.Free / 1GB))

          $tempPaths = @(
            "$env:TEMP\*",
            "$env:WINDIR\Temp\*",
            "$env:LOCALAPPDATA\Temp\*"
          )
          foreach ($path in $tempPaths) { Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue }
          Clear-RecycleBin -DriveLetter C -Force -ErrorAction SilentlyContinue

          Stop-Service wuauserv -Force -ErrorAction SilentlyContinue
          Stop-Service bits -Force -ErrorAction SilentlyContinue
          Stop-Service dosvc -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:WINDIR\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:ProgramData\Microsoft\Windows\DeliveryOptimization\Cache\*" -Recurse -Force -ErrorAction SilentlyContinue
          Start-Service bits -ErrorAction SilentlyContinue
          Start-Service wuauserv -ErrorAction SilentlyContinue
          Start-Service dosvc -ErrorAction SilentlyContinue

          DISM.exe /Online /Cleanup-Image /StartComponentCleanup

          Remove-Item "$env:ProgramData\Microsoft\Windows\WER\ReportArchive\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:ProgramData\Microsoft\Windows\WER\ReportQueue\*" -Recurse -Force -ErrorAction SilentlyContinue

          Stop-Service WSearch -Force -ErrorAction SilentlyContinue
          Set-Service WSearch -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service SysMain -Force -ErrorAction SilentlyContinue
          Set-Service SysMain -StartupType Disabled -ErrorAction SilentlyContinue
          powercfg /setactive SCHEME_MIN

          $tsPolicy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $tsPolicy -Force | Out-Null
          Set-ItemProperty $tsPolicy -Name fNoWallpaper -Type DWord -Value 1 -Force
          Set-ItemProperty $tsPolicy -Name fDisableFullWindowDrag -Type DWord -Value 1 -Force
          Set-ItemProperty $tsPolicy -Name fAllowFontSmoothing -Type DWord -Value 0 -Force
          Set-ItemProperty $tsPolicy -Name fEnableDesktopComposition -Type DWord -Value 0 -Force
          Set-ItemProperty $tsPolicy -Name fDisableMenuAnims -Type DWord -Value 1 -Force

          # Remove the unnecessary software visible in the supplied screenshots.
          # Keep Chrome, Git, PowerShell, Node.js and Tailscale because they are useful/runner-critical.
          $removePatterns = @(
            'Microsoft Edge*',
            'Mozilla Firefox*',
            'Unity Hub*',
            'Rtools*',
            'R for Windows*',
            'R (x64)*',
            'R 4.*',
            'Strawberry Perl*',
            'AWS Command Line Interface*',
            'AWS SAM Command Line Interface*',
            'AWS Service Fabric*',
            'Azure Cosmos DB Emulator*',
            'Microsoft Azure Service Fabric*',
            'Microsoft Azure CLI*',
            'Azure CLI*',
            'Epic Online Services*',
            'Mercurial*',
            'TortoiseSVN*',
            'ImageMagick*',
            'IIS 10.0 Express*',
            'GitHub CLI*',
            'Microsoft SQL Server Data-Tier Application Framework*',
            'Microsoft SQL Server Integration Services Projects*',
            'sbt*',
            'Inno Setup*',
            'MySQL Server 8.0*',
            'PostgreSQL 14*',
            'MongoDB*',
            'OpenSSL*',
            'CMake*',
            'Windows Driver Kit*',
            'Windows Software Development Kit*'
          )

          $uninstallPaths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entries = foreach ($path in $uninstallPaths) {
            Get-ItemProperty $path -ErrorAction SilentlyContinue | Where-Object DisplayName
          }

          foreach ($entry in $entries) {
            $display = [string]$entry.DisplayName
            $match = $removePatterns | Where-Object { $display -like $_ } | Select-Object -First 1
            if (-not $match) { continue }
            if ($display -like 'Google Chrome*' -or $display -like 'Git*' -or $display -like 'PowerShell*' -or $display -like 'Node.js*' -or $display -like 'Tailscale*') { continue }

            $cmd = if ($entry.QuietUninstallString) { [string]$entry.QuietUninstallString } else { [string]$entry.UninstallString }
            if (-not $cmd) { Write-Host "No uninstall command: $display"; continue }

            Write-Host "Removing: $display"
            try {
              if ($cmd -match '(?i)msiexec') {
                $cmd = $cmd -replace '(?i)/I', '/X'
                if ($cmd -notmatch '(?i)/qn') { $cmd += ' /qn' }
                if ($cmd -notmatch '(?i)/norestart') { $cmd += ' /norestart' }
              } elseif ($cmd -notmatch '(?i)(/quiet|/silent|/verysilent|\s/s(\s|$))') {
                $cmd += ' /quiet /norestart'
              }
              $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', $cmd -PassThru -WindowStyle Hidden
              if (-not $p.WaitForExit(60000)) {
                Write-Warning "Uninstaller exceeded 60 seconds; terminating: $display"
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              } else {
                Write-Host "Exit code: $($p.ExitCode)"
              }
            } catch { Write-Host "Skipped uninstall: $display" }
          }

          foreach ($path in $tempPaths) { Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue }
          $after = Get-PSDrive C
          Write-Host ("Free space after cleanup: {0:N2} GB" -f ($after.Free / 1GB))
          Write-Host ("Recovered: {0:N2} GB" -f (($after.Free - $before.Free) / 1GB))

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "rtrtRt1212@"
$securePass = ConvertTo-SecureString $password -AsPlainText -Force

New-LocalUser `
  -Name "RDP" `
  -Password $securePass `
  -AccountNeverExpires `
  -PasswordNeverExpires

Add-LocalGroupMember `
  -Group "Administrators" `
  -Member "RDP"

Add-LocalGroupMember `
  -Group "Remote Desktop Users" `
  -Member "RDP"

echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

if (-not (Get-LocalUser -Name "RDP")) {
    Write-Error "User creation failed"
    exit 1
}
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install Free Download Manager
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://files2.freedownloadmanager.org/6/latest/fdm_x64_setup.exe"
          $installer = "$env:TEMP\fdm_x64_setup.exe"

          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -L --fail --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o "$installer" "$url"
          $sw.Stop()

          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 5MB) {
            throw "FDM installer download failed or is unexpectedly small."
          }
          Write-Host ("FDM download: {0:N2} MB in {1:N1} seconds" -f ((Get-Item $installer).Length/1MB), $sw.Elapsed.TotalSeconds)

          $sw.Restart()
          $proc = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            Write-Warning "FDM installer exceeded 120 seconds. Terminating and continuing."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process fdm* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $sw.Stop()
          Write-Host ("FDM install phase: {0:N1} seconds" -f $sw.Elapsed.TotalSeconds)
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Configure FDM Chrome Extension
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { Write-Warning "Chrome not found; skipping FDM extension policy."; exit 0 }

          $extensionId = "ahmpjcflkgiildlgicmcieglgoilbfdp"
          $policyPath = 'HKLM:\SOFTWARE\Policies\Google\Chrome'
          New-Item $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name ExtensionInstallForcelist -PropertyType MultiString `
            -Value @("$extensionId;https://clients2.google.com/service/update2/crx") -Force | Out-Null
          Write-Host "FDM Chrome extension policy configured: $extensionId"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
