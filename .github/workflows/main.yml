name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Fast Cleanup of Large Unneeded Apps
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Write-Host "========================================"
          Write-Host " FAST CLEANUP"
          Write-Host "========================================"

          $before = (Get-PSDrive C).Free

          # Only remove large development/database components that are
          # unnecessary for this RDP + Tailscale + Chrome + FDM workflow.
          # Small utilities and Windows dependencies are intentionally left alone.
          $targets = @(
            "Rtools*",
            "Microsoft Azure Cosmos DB Emulator*",
            "Windows Software Development Kit*",
            "Windows Driver Kit*",
            "MongoDB*",
            "PostgreSQL*",
            "MySQL Server*",
            "Microsoft SQL Server Integration Services Projects*",
            "Microsoft SQL Server Data-Tier Application Framework*",
            "Azure Service Fabric*",
            "sbt*"
          )

          $apps = Get-CimInstance Win32_Product -ErrorAction SilentlyContinue |
            Where-Object {
              $name = $_.Name
              $targets | Where-Object { $name -like $_ }
            }

          foreach ($app in $apps) {
            Write-Host "Removing: $($app.Name)"

            # Give each large package a short window and move on.
            $job = Start-Job -ScriptBlock {
              param($productCode)
              $p = Get-CimInstance Win32_Product -Filter "IdentifyingNumber='$productCode'" -ErrorAction SilentlyContinue
              if ($p) {
                Invoke-CimMethod -InputObject $p -MethodName Uninstall | Out-Null
              }
            } -ArgumentList $app.IdentifyingNumber

            if (Wait-Job $job -Timeout 15) {
              Receive-Job $job -ErrorAction SilentlyContinue | Out-Null
              Write-Host "Uninstall attempt finished: $($app.Name)"
            }
            else {
              Stop-Job $job -Force -ErrorAction SilentlyContinue
              Write-Host "Skipped after 15 seconds: $($app.Name)"
            }

            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:WINDIR\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -DriveLetter C -Force -ErrorAction SilentlyContinue

          DISM.exe /Online /Cleanup-Image /StartComponentCleanup /Quiet

          $after = (Get-PSDrive C).Free

          Write-Host ("Free space after cleanup: {0:N2} GB" -f ($after / 1GB))
          Write-Host ("Space change: {0:N2} GB" -f (($after - $before) / 1GB))
          Write-Host "Fast cleanup completed."

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = "Mr.Sukuna99"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install Free Download Manager
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://files2.freedownloadmanager.org/6/latest/fdm_x64_setup.exe"
          $installer = "$env:TEMP\fdm_x64_setup.exe"

          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -L --fail --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o "$installer" "$url"
          $sw.Stop()

          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 5MB) {
            throw "FDM installer download failed or is unexpectedly small."
          }
          Write-Host ("FDM download: {0:N2} MB in {1:N1} seconds" -f ((Get-Item $installer).Length/1MB), $sw.Elapsed.TotalSeconds)

          $sw.Restart()
          $proc = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            Write-Warning "FDM installer exceeded 120 seconds. Terminating and continuing."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process fdm* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $sw.Stop()
          Write-Host ("FDM install phase: {0:N1} seconds" -f $sw.Elapsed.TotalSeconds)
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Configure FDM Chrome Extension
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { Write-Warning "Chrome not found; skipping FDM extension policy."; exit 0 }

          $extensionId = "ahmpjcflkgiildlgicmcieglgoilbfdp"
          $policyPath = 'HKLM:\SOFTWARE\Policies\Google\Chrome'
          New-Item $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name ExtensionInstallForcelist -PropertyType MultiString `
            -Value @("$extensionId;https://clients2.google.com/service/update2/crx") -Force | Out-Null
          Write-Host "FDM Chrome extension policy configured: $extensionId"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
