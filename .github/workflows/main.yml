name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Fast Windows 11 Cleanup and Optimization
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $before = (Get-PSDrive C).Free

          Write-Host "========================================"
          Write-Host " WINDOWS 11 FAST CLEANUP + OPTIMIZATION"
          Write-Host "========================================"

          # Keep the useful runtime/tooling needed by this RDP workflow:
          # Chrome, Git, Node.js, PowerShell, 7-Zip, Tailscale and Windows core components.
          # Remove only clearly unnecessary preinstalled developer/database/browser apps.
          $patterns = @(
            "Rtools*",
            "Microsoft Edge*",
            "Mozilla Firefox*",
            "Mozilla Maintenance Service*",
            "Unity Hub*",
            "Azure Cosmos DB Emulator*",
            "Microsoft Azure Service Fabric*",
            "Windows Software Development Kit*",
            "Windows SDK AddOn*",
            "Windows Driver Kit*",
            "MongoDB*",
            "PostgreSQL*",
            "MySQL Server*",
            "Microsoft SQL Server Integration Services Projects*",
            "Microsoft SQL Server Data-Tier Application Framework*",
            "Microsoft SQL Server 2025 LocalDB*",
            "PowerShell Extensions for SQL Server*",
            "AWS Command Line Interface*",
            "AWS SAM Command Line Interface*",
            "AWS SAM Command Line Interface*",
            "Mercurial*",
            "TortoiseSVN*",
            "sbt*",
            "Strawberry Perl*",
            "ImageMagick*",
            "IIS Express*",
            "GitHub CLI*",
            "Microsoft Web Platform Installer*",
            "Inno Setup*",
            "Epic Online Services*"
          )

          # Never target these, even if a broad pattern matches something nearby.
          $protected = @(
            "Google Chrome*",
            "Microsoft Edge WebView2 Runtime*",
            "Git*",
            "Node.js*",
            "PowerShell*",
            "7-Zip*",
            "Tailscale*"
          )

          $roots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $apps = foreach ($root in $roots) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object {
                $n = [string]$_.DisplayName
                $n -and ($patterns | Where-Object { $n -like $_ }) -and -not ($protected | Where-Object { $n -like $_ })
              }
          }

          $apps = $apps | Where-Object { $_.UninstallString } | Sort-Object DisplayName -Unique

          function Invoke-Uninstaller($app) {
            $u = [string]$app.UninstallString
            Write-Host "Removing: $($app.DisplayName)"

            if ($u -match '(?i)msiexec(?:\.exe)?' -and $u -match '\{[0-9A-Fa-f-]{36}\}') {
              $code = $Matches[0]
              $proc = Start-Process "$env:WINDIR\System32\msiexec.exe" `
                -ArgumentList @('/x',$code,'/qn','/norestart') -PassThru -WindowStyle Hidden
              if ($proc.WaitForExit(30000)) {
                Write-Host "  MSI exit code: $($proc.ExitCode)"
              } else {
                Write-Host "  Still running after 30s; leaving installer alone and continuing."
              }
              return
            }

            # Handle common EXE uninstallers without inventing silent switches.
            # If the vendor string already contains quiet switches, preserve them.
            if ($u -match '^\s*"([^"]+)"\s*(.*)$') {
              $exe=$Matches[1]; $args=$Matches[2]
            } elseif ($u -match '^\s*([^\s]+)\s*(.*)$') {
              $exe=$Matches[1]; $args=$Matches[2]
            } else { return }

            if (Test-Path $exe) {
              $proc=Start-Process -FilePath $exe -ArgumentList $args -PassThru -WindowStyle Hidden
              if ($proc.WaitForExit(30000)) { Write-Host "  Exit code: $($proc.ExitCode)" }
              else { Write-Host "  Still running after 30s; continuing." }
            }
          }

          foreach ($app in $apps) { Invoke-Uninstaller $app }

          # Remove common per-user bloat left by removed apps.
          Remove-Item "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:WINDIR\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Clear-RecycleBin -DriveLetter C -Force -ErrorAction SilentlyContinue

          # Windows 11 performance profile for a disposable VM/RDP session.
          powercfg /setactive SCHEME_MIN
          powercfg /hibernate off

          # Visual effects: prioritize responsiveness over animations/transparency.
          $adv = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects'
          New-Item $adv -Force | Out-Null
          Set-ItemProperty $adv -Name VisualFXSetting -Type DWord -Value 2 -Force
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name UserPreferencesMask -Type Binary `
            -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) -Force
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name EnableTransparency -Type DWord -Value 0 -Force

          # RDP visual settings: reduce graphics/network overhead.
          $rdp='HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item $rdp -Force | Out-Null
          Set-ItemProperty $rdp -Name fDisableWallpaper -Type DWord -Value 1 -Force
          Set-ItemProperty $rdp -Name fDisableFullWindowDrag -Type DWord -Value 1 -Force
          Set-ItemProperty $rdp -Name fDisableMenuAnims -Type DWord -Value 1 -Force
          Set-ItemProperty $rdp -Name fDisableThemes -Type DWord -Value 1 -Force
          Set-ItemProperty $rdp -Name fEnableTimeZoneRedirection -Type DWord -Value 1 -Force

          # Disable services that provide little value on a disposable RDP VM.
          # Do NOT disable Windows Update, Defender, RPC, TermService, or networking.
          foreach ($svc in @('SysMain','WSearch','DiagTrack')) {
            Stop-Service $svc -Force -ErrorAction SilentlyContinue
            Set-Service $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # Reduce background consumer features on Windows 11.
          New-Item 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent' -Force | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent' -Name DisableWindowsConsumerFeatures -Type DWord -Value 1 -Force

          # Component store cleanup.
          DISM.exe /Online /Cleanup-Image /StartComponentCleanup /Quiet

          $after = (Get-PSDrive C).Free
          Write-Host ("Free space after cleanup: {0:N2} GB" -f ($after/1GB))
          Write-Host ("Space recovered: {0:N2} GB" -f (($after-$before)/1GB))
          Write-Host "Windows 11 optimization completed."

      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $password = "Mr.Sukuna99"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Bring up Tailscale with the provided auth key and set a unique hostname
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          # Test connectivity using Test-NetConnection against the Tailscale IP on port 3389
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Install Free Download Manager
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $url = "https://files2.freedownloadmanager.org/6/latest/fdm_x64_setup.exe"
          $installer = "$env:TEMP\fdm_x64_setup.exe"

          $sw = [Diagnostics.Stopwatch]::StartNew()
          curl.exe -L --fail --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 -o "$installer" "$url"
          $sw.Stop()

          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 5MB) {
            throw "FDM installer download failed or is unexpectedly small."
          }
          Write-Host ("FDM download: {0:N2} MB in {1:N1} seconds" -f ((Get-Item $installer).Length/1MB), $sw.Elapsed.TotalSeconds)

          $sw.Restart()
          $proc = Start-Process -FilePath $installer -ArgumentList "/SP-", "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $proc.WaitForExit(120000)) {
            Write-Warning "FDM installer exceeded 120 seconds. Terminating and continuing."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process fdm* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $sw.Stop()
          Write-Host ("FDM install phase: {0:N1} seconds" -f $sw.Elapsed.TotalSeconds)
          Remove-Item $installer -Force -ErrorAction SilentlyContinue

      - name: Configure FDM Chrome Extension
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $chrome = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { Write-Warning "Chrome not found; skipping FDM extension policy."; exit 0 }

          $extensionId = "ahmpjcflkgiildlgicmcieglgoilbfdp"
          $policyPath = 'HKLM:\SOFTWARE\Policies\Google\Chrome'
          New-Item $policyPath -Force | Out-Null
          New-ItemProperty -Path $policyPath -Name ExtensionInstallForcelist -PropertyType MultiString `
            -Value @("$extensionId;https://clients2.google.com/service/update2/crx") -Force | Out-Null
          Write-Host "FDM Chrome extension policy configured: $extensionId"

      - name: Verify Runner Resources
        shell: powershell
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("CPU cores: {0}" -f $cs.NumberOfLogicalProcessors)
          Write-Host ("RAM reported by Windows: {0:N2} GB" -f ($cs.TotalPhysicalMemory/1GB))
          Write-Host ("Free RAM: {0:N2} GB" -f ($os.FreePhysicalMemory/1MB))
          Write-Host ("OS: {0}" -f $os.Caption)
          Write-Host "Note: RAM is assigned by GitHub's runner size, not by the workflow script."

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
